user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # CRITICAL FIX 1: Security Header Injection (Global)
    # Prevents MIME-type sniffing (resolves 'x-content-type-options' error)
    add_header X-Content-Type-Options nosniff always;
    # CRITICAL FIX 2: Mask Server Header (resolves 'server' header warning)
    server_tokens off;

    # 1. Docker Internal DNS Resolver
    resolver 127.0.0.11 valid=5s ipv6=off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 2. Optimization & Limits
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M; # Allow large file uploads

    # 3. Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # 4. Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-javascript image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        # Define upstreams using variables to prevent crash on startup
        set $backend_host "backend:8001";
        set $ollama_host "ollama:11434";

        root /usr/share/nginx/html;
        index index.html;

        # --- PROXY ROUTES ---

        # 1. API Backend (Handles WebSockets, CORS, and standard API traffic)
        location /api/ {
            
            # CRITICAL FIX: Handle preflight OPTIONS request securely
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Request-ID' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://$backend_host;
            
            # WebSocket Headers (Critical for Agent Telemetry)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            # Standard Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts for long AI generation tasks
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # CORS headers for actual API responses (non-OPTIONS requests)
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # 2. Orchestrator API (Rewrite for legacy compatibility)
        location /orchestrator-api {
            rewrite ^/orchestrator-api/(.*)$ /api/command/execute break;
            proxy_pass http://$backend_host;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. Ollama AI Service
        location /ollama/ {
            proxy_pass http://$ollama_host/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- FRONTEND ASSETS ---

        # Service Worker (No Cache)
        location = /service-worker.js {
            add_header Content-Type application/javascript;
            expires off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Static Assets (Cached) - Correctly sets Cache-Control for long-term caching
        location ~* \.(css|js|gif|jpe?g|png|svg|ico|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Nginx Health Check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # SPA Fallback (Root Location)
        location / {
            # CORS headers for SPA routing
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;

            autoindex off;
            try_files $uri $uri/ /index.html;
            
            # CRITICAL FIX 3: Ensure index.html is never cached (resolves 'cache-control' error for index)
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}