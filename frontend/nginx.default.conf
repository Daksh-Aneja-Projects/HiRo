server {
    listen 80;
    server_name localhost;
    
    # CRITICAL FIX: Ensure large file uploads/requests are supported (100MB max body size)
    client_max_body_size 100M; 

    # Host definitions from nginx.full.conf/nginx.default.conf
    set $backend_host "backend:8001";
    set $ollama_host "ollama:11434";

    # SPA Root and Index
    root /usr/share/nginx/html;
    index index.html;
    
    # --------------------------------------------------------
    # 1. CORS Headers and Preflight (Must be open for API communication)
    # NOTE: These headers apply to ALL responses, including 204 from OPTIONS
    # --------------------------------------------------------
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Request-ID' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,Authorization,X-Request-ID' always; 

    # Handle preflight requests (OPTIONS method)
    # CRITICAL FIX: The add_header directives defining CORS methods/origins 
    # are removed here because they are redundant (defined above) and cause the NGINX error.
    if ($request_method = 'OPTIONS') {
        # Only specific headers related to preflight response size/age remain
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204; 
    }

    # --------------------------------------------------------
    # 2. API BACKEND - Direct Proxy (AUTHENTICATION PASSES HERE)
    # --------------------------------------------------------
    location /api/ {
        proxy_pass http://$backend_host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Credentials;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
        proxy_pass_header Access-Control-Expose-Headers;
    }

    # --------------------------------------------------------
    # 3. ORCHESTRATOR Proxy 
    # --------------------------------------------------------
    location /orchestrator-api {
        rewrite ^/orchestrator-api/(.*)$ /api/command/execute break;
        proxy_pass http://$backend_host;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------
    # 4. Ollama Proxy 
    # --------------------------------------------------------
    location /ollama/ {
        proxy_pass http://$ollama_host/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --------------------------------------------------------
    # 5. Service Worker - NO CACHE 
    # --------------------------------------------------------
    location = /service-worker.js {
        add_header Content-Type application/javascript;
        access_log off;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # --------------------------------------------------------
    # 6. Static Assets with Cache 
    # --------------------------------------------------------
    location ~* \.(css|js|gif|jpe?g|png|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------
    # 7. Health Check Endpoint 
    # --------------------------------------------------------
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # --------------------------------------------------------
    # 8. SPA Fallback / Catch-All 
    # --------------------------------------------------------
    location / {
        autoindex off;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}